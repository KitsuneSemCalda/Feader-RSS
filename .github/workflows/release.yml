name: Release plugin

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate:
    name: Validate before release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate plugin
        run: |
          python -m json.tool manifest.json >/dev/null
          python -m unittest discover -s tests -v
          bash -n scripts/install.sh

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test Go backend
        run: go test -race ./...

  build-binaries:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }} binary
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          version="${GITHUB_REF_NAME#v}"
          out="feader-rss-fetch_${version}_${GOOS}_${GOARCH}"
          go build -trimpath -ldflags "-s -w -X main.version=${version}" -o "${out}" ./cmd/feader-rss-fetch
          sha256sum "${out}" >> checksums.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            feader-rss-fetch_*
            checksums.txt
          retention-days: 1

  release:
    name: Package and publish release
    needs: build-binaries
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true

      - name: Combine checksums
        run: |
          cat dist/checksums.txt | sort -u -k2 > checksums.txt
          rm -f dist/checksums.txt

      - name: Read plugin metadata
        id: metadata
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          manifest = json.loads(Path("manifest.json").read_text())
          print(f"plugin_id={manifest['id']}")
          print(f"plugin_name={manifest['name']}")
          PY

      - name: Build plugin archive
        env:
          PLUGIN_ID: ${{ steps.metadata.outputs.plugin_id }}
          PLUGIN_VERSION: ${{ github.ref_name }}
        id: package
        run: |
          archive="${PLUGIN_ID}-${PLUGIN_VERSION}.zip"
          zip -q "$archive" \
            manifest.json \
            BarWidget.qml \
            Panel.qml \
            README.md \
            LICENSE \
            preview.png \
            example-config.json
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ steps.package.outputs.archive }}
            dist/feader-rss-fetch_*
            checksums.txt
