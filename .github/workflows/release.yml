name: Release plugin

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Package and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate before release
        run: |
          python -m json.tool manifest.json >/dev/null
          python -m unittest discover -s tests -v
          bash -n scripts/install.sh

      - name: Read plugin metadata
        id: metadata
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          manifest = json.loads(Path("manifest.json").read_text())
          print(f"plugin_id={manifest['id']}")
          print(f"plugin_name={manifest['name']}")
          PY

      - name: Build plugin archive
        env:
          PLUGIN_ID: ${{ steps.metadata.outputs.plugin_id }}
          PLUGIN_VERSION: ${{ github.ref_name }}
        run: |
          archive="${PLUGIN_ID}-${PLUGIN_VERSION}.zip"
          zip -q "$archive" \
            manifest.json \
            BarWidget.qml \
            Panel.qml \
            rss-fetch.py \
            README.md \
            LICENSE \
            preview.png
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
        id: package

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ${{ steps.package.outputs.archive }}
